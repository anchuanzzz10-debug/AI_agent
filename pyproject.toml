[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-agent"
version = "0.1.0"
description = "Personal AI agent core: multi-project website/app monitoring with approval-gated, verified fixes."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "PyYAML>=6",
  "keyring>=24",   # Windows Credential Manager for the vault passphrase
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Voice models are heavy and optional; install on the machine that runs voice.
voice = ["faster-whisper>=1.0"]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
